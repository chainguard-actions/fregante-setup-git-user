name: Test basic git user setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert git user.name is set correctly
        run: |
          ACTUAL="$(git config user.name)"
          echo "actual user.name: $ACTUAL"
          if [ "$ACTUAL" != "github-actions[bot]" ]; then
            echo "FAIL: expected 'github-actions[bot]' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: user.name is correct"
      - name: Assert git user.email is set correctly
        run: |
          ACTUAL="$(git config user.email)"
          echo "actual user.email: $ACTUAL"
          if [ "$ACTUAL" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "FAIL: expected '41898282+github-actions[bot]@users.noreply.github.com' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: user.email is correct"
